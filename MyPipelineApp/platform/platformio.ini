[env:esp32dev]
# =========================================================================
#       FINAL CERTIFIED CONFIGURATION (v10.0 - Restored & Modernized)
# =========================================================================
platform = espressif32
board = esp32dev
framework = arduino

# --- Library Dependencies ---
# This combination forces the use of modern, compatible libraries
# that will work with the updated code generator.
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    https://github.com/me-no-dev/AsyncTCP.git
    tanakamasayuki/TensorFlowLite_ESP32

monitor_speed = 115200

